<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LMS Class Diagram</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --border:#c7cbd4; --text:#1b1e24; --text-dim:#5a6070;
    --accent:#c0392b; --accent-soft:#f6dcd8; --iface-fill:#eef1f7; --abstract-fill:#fbf7ee;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161b; --surface:#1b1e25; --border:#3a3f4a; --text:#e9ebf1; --text-dim:#9aa1b0;
      --accent:#ff6b57; --accent-soft:#3a2622; --iface-fill:#20242e; --abstract-fill:#241f18;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161b; --surface:#1b1e25; --border:#3a3f4a; --text:#e9ebf1; --text-dim:#9aa1b0;
    --accent:#ff6b57; --accent-soft:#3a2622; --iface-fill:#20242e; --abstract-fill:#241f18;
  }
  body{background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,sans-serif; margin:0; padding-block:28px;}
  .wrap{max-width:1200px; margin:0 auto; padding:0 16px;}
  h1{font-size:20px; margin:0 0 4px;}
  p.sub{color:var(--text-dim); font-size:13px; margin:0 0 20px;}
  figure{margin:0;}
  svg{width:100%; height:auto; display:block; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:8px;}
  figcaption{color:var(--text-dim); font-size:13px; margin-top:12px; line-height:1.6;}
  figcaption code{font-family:'JetBrains Mono',monospace; font-size:12px; background:var(--iface-fill); padding:1px 5px; border-radius:3px;}
  .legend{display:flex; gap:22px; flex-wrap:wrap; font-size:12px; color:var(--text-dim); margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Library Management System — Class Diagram</h1>
  <p class="sub">Simplified view: core classes, key members only.</p>

  <figure>
    <svg viewBox="0 0 1320 1240" role="img" aria-label="Simplified UML class diagram of the Library Management System domain model">

      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10" fill="none" stroke="currentColor" stroke-width="1.6"/>
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
        </marker>
        <marker id="diamondFilled" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="15" markerHeight="10" orient="auto-start-reverse">
          <polygon points="1,5 8,1 15,5 8,9" fill="currentColor" stroke="currentColor" stroke-width="1"/>
        </marker>
      </defs>

      <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">

        <!-- ============ ROW 1: custom interfaces ============ -->
        <rect x="60" y="30" width="210" height="80" rx="5" fill="var(--iface-fill)" stroke="currentColor" stroke-width="1.3"/>
        <text x="165" y="53" text-anchor="middle" font-style="italic" font-size="12">«interface»</text>
        <text x="165" y="73" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15">Identifiable</text>
        <line x1="60" y1="82" x2="270" y2="82" stroke="currentColor" stroke-width="1"/>
        <text x="72" y="102" font-size="12">+ getIdentifier(): String</text>

        <rect x="960" y="30" width="240" height="130" rx="5" fill="var(--iface-fill)" stroke="currentColor" stroke-width="1.3"/>
        <text x="1080" y="53" text-anchor="middle" font-style="italic" font-size="12">«interface»</text>
        <text x="1080" y="73" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15">Borrowable</text>
        <line x1="960" y1="82" x2="1200" y2="82" stroke="currentColor" stroke-width="1"/>
        <text x="972" y="102" font-size="12">+ borrow(): void</text>
        <text x="972" y="122" font-size="12">+ returnItem(): void</text>
        <text x="972" y="142" font-size="12">+ isAvailable(): bool</text>

        <!-- ============ ROW 2: abstract classes ============ -->
        <rect x="40" y="200" width="280" height="190" rx="5" fill="var(--abstract-fill)" stroke="currentColor" stroke-width="1.4"/>
        <text x="180" y="226" text-anchor="middle" font-style="italic" font-family="Inter" font-weight="700" font-size="16">LibraryItem</text>
        <text x="180" y="244" text-anchor="middle" font-size="11" opacity="0.8">«abstract» · Comparable&lt;LibraryItem&gt;</text>
        <line x1="40" y1="254" x2="320" y2="254" stroke="currentColor" stroke-width="1"/>
        <text x="52" y="276">- stableId: int</text>
        <text x="52" y="296">- title: String</text>
        <text x="52" y="316">- status: String</text>
        <line x1="40" y1="328" x2="320" y2="328" stroke="currentColor" stroke-width="1"/>
        <text x="52" y="350">+ compareTo(): int</text>
        <text x="52" y="370" font-style="italic">+ getDisplayInfo()</text>

        <rect x="940" y="200" width="280" height="190" rx="5" fill="var(--abstract-fill)" stroke="currentColor" stroke-width="1.4"/>
        <text x="1080" y="226" text-anchor="middle" font-style="italic" font-family="Inter" font-weight="700" font-size="16">User</text>
        <text x="1080" y="244" text-anchor="middle" font-size="11" opacity="0.8">«abstract» · Comparable&lt;User&gt;</text>
        <line x1="940" y1="254" x2="1220" y2="254" stroke="currentColor" stroke-width="1"/>
        <text x="952" y="276">- stableId: String</text>
        <text x="952" y="296">- firstName: String</text>
        <text x="952" y="316">- lastName: String</text>
        <line x1="940" y1="328" x2="1220" y2="328" stroke="currentColor" stroke-width="1"/>
        <text x="952" y="350">+ compareTo(): int</text>
        <text x="952" y="370" font-style="italic">+ getDisplayInfo()</text>

        <!-- ============ ROW 3: concrete subclasses ============ -->
        <rect x="20" y="450" width="200" height="150" rx="5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        <text x="120" y="474" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15">Book</text>
        <line x1="20" y1="484" x2="220" y2="484" stroke="currentColor" stroke-width="1"/>
        <text x="32" y="504">- author: String</text>
        <line x1="20" y1="514" x2="220" y2="514" stroke="currentColor" stroke-width="1"/>
        <text x="32" y="534">+ borrow()</text>
        <text x="32" y="554">+ returnItem()</text>
        <text x="32" y="580" font-family="Inter" font-size="11" fill="var(--accent)">throws LibraryException</text>

        <rect x="250" y="450" width="180" height="90" rx="5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        <text x="340" y="474" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15">Magazine</text>
        <line x1="250" y1="484" x2="430" y2="484" stroke="currentColor" stroke-width="1"/>
        <text x="262" y="504" font-size="11" opacity="0.75">Not Borrowable —</text>
        <text x="262" y="522" font-size="11" opacity="0.75">reading room only</text>

        <rect x="940" y="450" width="190" height="100" rx="5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        <text x="1035" y="474" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15">Member</text>
        <line x1="940" y1="484" x2="1130" y2="484" stroke="currentColor" stroke-width="1"/>
        <text x="952" y="504" font-size="12">- activeLoanLimit: int</text>
        <line x1="940" y1="514" x2="1130" y2="514" stroke="currentColor" stroke-width="1"/>
        <text x="952" y="534" font-size="12">+ getActiveLoanLimit()</text>

        <rect x="1160" y="450" width="140" height="100" rx="5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 3" opacity="0.85"/>
        <text x="1230" y="474" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12.5">Librarian</text>
        <text x="1230" y="490" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12.5">Admin</text>
        <text x="1230" y="512" text-anchor="middle" font-size="10.5" opacity="0.8">staff roles,</text>
        <text x="1230" y="528" text-anchor="middle" font-size="10.5" opacity="0.8">extend User</text>

        <!-- ============ ROW 4: Loan / Reservation ============ -->
        <rect x="360" y="650" width="260" height="180" rx="5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        <text x="490" y="674" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15">Loan</text>
        <text x="490" y="690" text-anchor="middle" font-size="11" opacity="0.8">Comparable&lt;Loan&gt;</text>
        <line x1="360" y1="700" x2="620" y2="700" stroke="currentColor" stroke-width="1"/>
        <text x="372" y="720">- borrower: User</text>
        <text x="372" y="740">- item: LibraryItem</text>
        <text x="372" y="760">- dueDate: LocalDate</text>
        <line x1="360" y1="772" x2="620" y2="772" stroke="currentColor" stroke-width="1"/>
        <text x="372" y="792">+ itemReturned()</text>
        <text x="372" y="812" font-size="11" opacity="0.75">+ nested DueDatePolicy</text>

        <rect x="700" y="650" width="260" height="180" rx="5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        <text x="830" y="674" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15">Reservation</text>
        <text x="830" y="690" text-anchor="middle" font-size="11" opacity="0.8">Comparable&lt;Reservation&gt;</text>
        <line x1="700" y1="700" x2="960" y2="700" stroke="currentColor" stroke-width="1"/>
        <text x="712" y="720">- member: User</text>
        <text x="712" y="740">- item: LibraryItem</text>
        <text x="712" y="760">- state: String</text>
        <line x1="700" y1="772" x2="960" y2="772" stroke="currentColor" stroke-width="1"/>
        <text x="712" y="792">+ fulfill()</text>
        <text x="712" y="812">+ compareTo()</text>

        <!-- ============ ROW 5: CirculationService ============ -->
        <rect x="440" y="890" width="300" height="150" rx="5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        <text x="590" y="914" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15">CirculationService</text>
        <line x1="440" y1="924" x2="740" y2="924" stroke="currentColor" stroke-width="1"/>
        <text x="452" y="944">- activeLoans: List&lt;Loan&gt;</text>
        <text x="452" y="964">- reservationQueues: Map</text>
        <line x1="440" y1="976" x2="740" y2="976" stroke="currentColor" stroke-width="1"/>
        <text x="452" y="996">+ borrowItem() + returnItem()</text>
        <text x="452" y="1016" font-size="11" fill="var(--accent)">+ reserveItem() — throws LibraryException</text>

        <!-- ============ ROW 6: storage / exception ============ -->
        <rect x="40" y="1080" width="230" height="120" rx="5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        <text x="155" y="1104" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15">Repository&lt;T&gt;</text>
        <text x="155" y="1120" text-anchor="middle" font-size="10.5" opacity="0.8">T extends Identifiable</text>
        <line x1="40" y1="1130" x2="270" y2="1130" stroke="currentColor" stroke-width="1"/>
        <text x="52" y="1150" font-size="12">+ add(T) / findById(String)</text>
        <text x="52" y="1170" font-size="12">+ static &lt;T&gt; of(Collection)</text>

        <rect x="300" y="1080" width="210" height="110" rx="5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        <text x="405" y="1104" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15">ItemList</text>
        <text x="405" y="1120" text-anchor="middle" font-size="10.5" opacity="0.8">Iterable&lt;LibraryItem&gt;</text>
        <line x1="300" y1="1130" x2="510" y2="1130" stroke="currentColor" stroke-width="1"/>
        <text x="312" y="1150" font-size="12">+ iterator()</text>
        <text x="312" y="1170" font-size="12">+ save() / load()</text>

        <rect x="540" y="1080" width="210" height="110" rx="5" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        <text x="645" y="1104" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15">UsersList</text>
        <line x1="540" y1="1114" x2="750" y2="1114" stroke="currentColor" stroke-width="1"/>
        <text x="552" y="1134" font-size="12">+ getSession(String)</text>
        <text x="552" y="1154" font-size="12">+ save() / load()</text>

        <rect x="800" y="1080" width="290" height="120" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
        <text x="945" y="1104" text-anchor="middle" font-family="Inter" font-weight="700" font-size="15" fill="var(--accent)">LibraryException</text>
        <text x="945" y="1120" text-anchor="middle" font-size="10.5" fill="var(--accent)" opacity="0.85">extends RuntimeException</text>
        <line x1="800" y1="1130" x2="1090" y2="1130" stroke="var(--accent)" stroke-width="1"/>
        <text x="812" y="1150" font-size="12" fill="var(--accent)">+ LibraryException(String)</text>
        <text x="812" y="1170" font-size="11" fill="var(--accent)" opacity="0.85">unchecked, no throws clause</text>

      </g>

      <!-- ================= CONNECTORS ================= -->
      <g fill="none" stroke="currentColor" stroke-width="1.4">
        <!-- realization -->
        <path d="M180,200 L165,110" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
        <path d="M1000,200 C 700,80 450,50 270,75" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
        <path d="M180,450 C 600,300 850,180 960,110" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

        <!-- inheritance -->
        <path d="M110,450 L150,390" marker-end="url(#arrow)"/>
        <path d="M330,450 L260,390" marker-end="url(#arrow)"/>
        <path d="M1035,450 L1070,390" marker-end="url(#arrow)"/>
        <path d="M1220,450 L1090,390" marker-end="url(#arrow)"/>

        <!-- Loan / Reservation associations (target LibraryItem / User, not their subclasses) -->
        <path d="M400,650 C 300,550 220,450 200,390" marker-end="url(#arrow)"/>
        <path d="M560,650 C 750,450 900,300 1000,390" marker-end="url(#arrow)"/>
        <path d="M900,650 C 1000,500 1080,430 1150,390" marker-end="url(#arrow)"/>
        <path d="M760,650 C 550,500 400,420 280,390" marker-end="url(#arrow)"/>

        <!-- CirculationService composition -->
        <path d="M550,890 L500,830" marker-end="url(#diamondFilled)"/>
        <path d="M680,890 L800,830" marker-end="url(#diamondFilled)"/>

        <!-- ItemList / UsersList composition (target LibraryItem / User, not their subclasses) -->
        <path d="M405,1080 C 350,850 300,500 280,390" marker-end="url(#diamondFilled)"/>
        <path d="M645,1080 C 750,800 950,500 1080,390" marker-end="url(#diamondFilled)"/>

        <!-- throws LibraryException -->
        <path d="M220,570 C 500,850 700,1000 800,1120" stroke="var(--accent)" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>
        <path d="M740,1000 L800,1080" stroke="var(--accent)" stroke-dasharray="5 3" marker-end="url(#arrowRed)"/>
      </g>

    </svg>
    <figcaption>
      <code>Identifiable</code> lets the generic <code>Repository&lt;T&gt;</code> look up either a <code>LibraryItem</code> or a <code>User</code> by ID. <code>Loan</code> and <code>Reservation</code> each reference one <code>User</code> and one <code>LibraryItem</code>; <code>CirculationService</code> owns and creates both. The red arrows show where the unchecked <code>LibraryException</code> is thrown instead of completing an invalid operation. Not pictured: the four <code>ordering</code> comparators (Title, Author, PublicationDate, DueDate) and the procedural <code>app.main</code> / <code>model.menu.*</code> console layer that calls into these classes.
    </figcaption>
    <div class="legend">
      <span>┄▷ implements interface</span>
      <span>—▷ extends class</span>
      <span>—◆ composition (owns)</span>
      <span>→ association</span>
      <span style="color:var(--accent)">┄→ throws LibraryException</span>
    </div>
  </figure>
</div>
</body>
</html>
